spring.application.name=dental-clinic
server.port=8080

# ---------------------------------------------------------------------------
# Datasource
# ---------------------------------------------------------------------------
# M0/M1 use an in-memory H2 database so the application runs with no external
# dependency. MySQL 8 replaces this in M2 -- see my-docs/PROJECT-PLAN.md.
spring.datasource.url=jdbc:h2:mem:dentalclinic;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---------------------------------------------------------------------------
# JPA
# ---------------------------------------------------------------------------
# 'validate' rather than 'update': Flyway owns the schema, Hibernate only checks
# that the entities match it. This keeps schema changes reviewable in version control.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------------
# Enabled in M2 once the first migration exists; there is nothing to migrate yet.
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# Development tooling (H2 console is disabled once MySQL lands)
# ---------------------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.endpoints.web.exposure.include=health,info
