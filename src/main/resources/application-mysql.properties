# =============================================================================
#  MySQL profile -- the authoritative target for this system.
#
#  Activate with:
#      ./mvnw spring-boot:run "-Dspring-boot.run.profiles=mysql"
#  or:
#      java -jar target/dental-clinic-0.0.1-SNAPSHOT.jar --spring.profiles.active=mysql
#
#  Prerequisite: a running MySQL 8 server and an empty schema, created once with
#      CREATE DATABASE sunrise_dental CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
#
#  Flyway then builds every table, index, trigger, function and procedure from
#  db/migration -- nothing is created by hand.
#
#  Credentials come from the environment so they are never committed. Defaults
#  match a stock WAMP/XAMPP install for convenience during development:
#      set DB_USERNAME / DB_PASSWORD to override.
# =============================================================================

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sunrise_dental}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}

# The H2 console has no purpose here and would be an unnecessary open surface.
spring.h2.console.enabled=false
