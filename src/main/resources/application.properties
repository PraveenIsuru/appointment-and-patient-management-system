spring.application.name=dental-clinic
server.port=8080

# ---------------------------------------------------------------------------
# Datasource -- development default
# ---------------------------------------------------------------------------
# H2 in MySQL compatibility mode, so the application runs with no external
# dependency. MySQL is the authoritative target: run with
#   --spring.profiles.active=mysql
# to use it (see application-mysql.properties).
spring.datasource.url=jdbc:h2:mem:dentalclinic;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---------------------------------------------------------------------------
# JPA
# ---------------------------------------------------------------------------
# 'validate' rather than 'update': Flyway owns the schema, and Hibernate only
# checks that the entity mappings agree with it. A mapping that drifts from the
# migrations fails at startup instead of silently altering tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------------
# Table DDL is portable and lives in 'common'. Objects that cannot be written
# portably -- the audit triggers, the function and the stored procedure -- live
# under the {vendor} folder, which Flyway resolves to 'h2' or 'mysql' from the
# active connection.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}

# ---------------------------------------------------------------------------
# Development tooling
# ---------------------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.endpoints.web.exposure.include=health,info
